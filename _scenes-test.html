<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>过程型场景构图自检</title>
<style>
  body { margin:0; background:#0a0e12; color:#dde5ec; font-family:"PingFang SC",sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(2,725px); gap:6px; padding:6px; }
  .cell { width:725px; height:340px; overflow:hidden; position:relative;
          border:1px solid #212b34; border-radius:6px; background:#10161c; }
  .cell iframe { position:absolute; border:0; width:1240px; height:1000px;
                 left:-225px; top:-465px; }
  .tag { position:absolute; left:6px; top:4px; z-index:5; font-size:11px;
         background:rgba(10,14,18,.82); color:#e8a33d; padding:1px 6px; border-radius:3px; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script type="module">
const query = new URLSearchParams(location.search);
const SIM = query.get('sim') || 'mohr-salt';
const FROM = +(query.get('from') || 0);
// 步骤名**从各 sim 的 sceneSpec 派生**，不再手抄。
// 手抄的代价：sim 里改个步骤名或加一步，这里会静默失真（曾经就是这样）。
import { sceneSpec as mohrSalt } from './js/sims/mohr-salt.js';
import { sceneSpec as magnesiumMolar } from './js/sims/magnesium-molar.js';
import { sceneSpec as kinetics } from './js/sims/kinetics.js';
import { sceneSpec as fe2Assay } from './js/sims/fe2-assay.js';
import { sceneSpec as titrationPractice } from './js/sims/titration-practice.js';
import { sceneSpec as waterHardness } from './js/sims/water-hardness.js';
import { sceneSpec as phAcetic } from './js/sims/ph-acetic.js';
import { sceneSpec as fe3Spec } from './js/sims/fe3-spec.js';
import { sceneSpec as cyanotype } from './js/sims/cyanotype.js';
import { sceneSpec as complexChem } from './js/sims/complex-chem.js';

const SPECS = { 'mohr-salt': mohrSalt, 'magnesium-molar': magnesiumMolar, kinetics, 'fe2-assay': fe2Assay,
  'titration-practice': titrationPractice, 'water-hardness': waterHardness, 'ph-acetic': phAcetic,
  'fe3-spec': fe3Spec, cyanotype, 'complex-chem': complexChem };
const spec = SPECS[SIM] || SPECS['mohr-salt'];
const title = spec.name;
const names = spec.steps.map(s => s.name);
document.title = `${title} · 场景构图自检`;
const g = document.getElementById('g');
for (let i = FROM; i < Math.min(FROM + 6, spec.steps.length); i++) {
  const d = document.createElement('div');
  d.className = 'cell';
  d.innerHTML = `<div class="tag">${title} · ${i + 1}. ${names[i]}</div>` +
    `<iframe src="/?sim=${spec.id}&mode=guide&step=${i}"></iframe>`;
  g.append(d);
}
if (FROM >= spec.steps.length) {
  document.body.insertAdjacentHTML('beforeend',
    `<p style="color:#e05a3d;padding:14px">from=${FROM} 超出范围：${spec.id} 只有 ${spec.steps.length} 步</p>`);
}
</script>
</body>
</html>
