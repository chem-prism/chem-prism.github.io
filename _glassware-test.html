<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>玻璃器皿自检</title>
<style>
  body { margin:0; background:#0a0e12; color:#dde5ec; font-family:"PingFang SC",sans-serif; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
import * as G from './js/glassware.js';

const COLS = 5, CELL_W = 200, CELL_H = 260;
const cv = document.getElementById('cv');
const dpr = 2;

const LIQ = [110, 200, 190, 0.55];

// 每格画一个器皿：坐标系原点挪到格子左上角
const items = [
  ['锥形瓶 液位0.35', (c, b) => G.conicalFlask(c, b, { liquid: LIQ, level: 0.35 })],
  ['锥形瓶 液位0.7',  (c, b) => G.conicalFlask(c, b, { liquid: LIQ, level: 0.7 })],
  ['量筒 正立',        (c, b) => G.cylinder(c, b, { liquid: LIQ, level: 0.6 })],
  ['加酸场景（实际尺寸）', (c, b) => {
    // 复刻 sims/mohr-salt.js 里 'pour' 那一步的构图与尺寸
    c.save();
    c.translate(b.x + b.w * 0.30, b.y + b.h * 0.46);
    c.rotate(0.42);
    G.cylinder(c, { x: -21, y: -68, w: 42, h: 136 }, { liquid: LIQ, level: 0.62 });
    c.restore();
    G.conicalFlask(c, { x: b.x + b.w * 0.46, y: b.y + 12, w: 62, h: b.h - 24 },
      { liquid: LIQ, level: 0.18 });
  }],
  ['短颈漏斗',         (c, b) => G.funnel(c, b, { liquid: LIQ, level: 0.45, stemLevel: 0.8 })],

  ['蒸发皿',           (c, b) => G.evapDish(c, b, { liquid: LIQ, level: 0.45 })],
  ['水浴锅',           (c, b) => G.waterBath(c, b, { steam: 0.7, t: 1.2, ringW: b.w * 0.55 })],
  ['布氏漏斗',         (c, b) => G.buchner(c, b, { liquid: LIQ, level: 0.4, cake: 0.65, cakeColor: G.MOHR_CRYSTAL_COLOR, dropColor: LIQ, dripping: true })],
  ['抽滤瓶',           (c, b) => G.suctionFlask(c, b, { liquid: LIQ, level: 0.3 })],
  ['表面皿',           (c, b) => G.watchGlass(c, b, { crystal: 0.8, crystalColor: G.MOHR_CRYSTAL_COLOR, t: 1 })],

  ['比色管',           (c, b) => G.comparisonTube(c, b, { liquid: [203, 64, 69, 1], level: 0.62 })],
  ['台秤',             (c, b) => G.balance(c, b, { item: true, itemColor: G.MOHR_CRYSTAL_COLOR, reading: '10.42', tone: 'good' })],
  ['电热板',           (c, b) => G.hotplate(c, b, { heat: 0.8, steam: 0.4, t: 1 })],
  ['玻璃棒',           (c, b) => G.stirringRod(c, b, { angle: 18 })],
  ['气泡 + 晶体',      (c, b) => { G.bubbles(c, b, 1.5, 0.9);
                                   G.crystals(c, { x: b.x + 10, y: b.y + 10, w: b.w - 20, h: b.h - 20 }, 1.5, 0.7, { color: G.MOHR_CRYSTAL_COLOR }); }],
  ['量气管',            (c, b) => G.gasMeasuringTube(c, b, { liquid: [150, 190, 215, 0.30], level: 0.52 })],
  ['滴定管',            (c, b) => G.burette(c, b, { liquid: [110, 200, 190, 0.42], level: 0.28 })],
  ['容量瓶',            (c, b) => G.volumetricFlask(c, b, { liquid: [110, 200, 190, 0.32], level: 0.46 })],
  ['移液管',            (c, b) => G.pipette(c, b, { angle: -0.10 })],
  ['大试管',            (c, b) => G.testTube(c, b, { liquid: [150, 190, 215, 0.30], level: 0.42 })],
  ['磁力搅拌器',        (c, b) => G.stirPlate(c, b)],
  ['温度计',            (c, b) => G.thermometer(c, b)],
  ['秒表',              (c, b) => G.stopwatch(c, b, { text: '82.0 s' })],
  ['铁架台',            (c, b) => G.retortStand(c, b, { clamp: { x: b.x + b.w * 0.72, y: b.y + b.h * 0.34, radius: b.w * 0.25 } })],
  ['导管',              (c, b) => G.tubing(c, [
    [b.x + 8, b.y + b.h * 0.72], [b.x + b.w * 0.38, b.y + b.h * 0.72],
    [b.x + b.w * 0.38, b.y + b.h * 0.30], [b.x + b.w - 8, b.y + b.h * 0.30],
  ], { width: 6 })],

  ['试剂瓶 细口',      (c, b) => G.reagentBottle(c, b, {
    liquid: [222, 232, 240, 0.20], level: 0.62, label: ['EDTA 标液', '0.005 M'] })],
  ['试剂瓶 广口棕',    (c, b) => G.reagentBottle(c, b, {
    shape: 'wide', solid: [168, 62, 84, 0.78], level: 0.45,
    label: ['钙指示剂'], labelTone: 'amber', cap: 'stopper', brown: true })],
  ['滴瓶 铬黑T',       (c, b) => G.reagentBottle(c, b, {
    shape: 'drop', liquid: [70, 60, 120, 0.55], level: 0.50, label: ['铬黑T'] })],
  ['洗耳球 + 移液管',  (c, b) => {
    G.washBulb(c, { x: b.x + 6, y: b.y + b.h * 0.30, w: 44, h: 53 }, { squeeze: 0.4 });
    G.pipette(c, { x: b.x + 34, y: b.y + b.h * 0.26, w: b.w - 40, h: 26 }, { angle: Math.PI / 2 });
  }],
  ['絮状沉淀 Mg(OH)₂', (c, b) => {
    G.conicalFlask(c, b, { liquid: [214, 220, 228, 0.30], level: 0.40 });
    G.precipitateFlocs(c, { x: b.x + b.w * 0.22, y: b.y + b.h * 0.42, w: b.w * 0.56, h: b.h * 0.52 }, 1.5, 0.8);
  }],
  ['pH 计 整机', (c, b) => {
    G.beaker(c, { x: b.x + 74, y: b.y + b.h - 92, w: 66, h: 92 }, { liquid: [214, 226, 238, 0.28], level: 0.52 });
    G.phMeter(c, { x: b.x, y: b.y + 4, w: b.w, h: b.h - 8 }, { reading: '3.35', slopePct: 98.2, bulbY: b.y + b.h - 46 });
  }],
  ['分光光度计 整机', (c, b) => G.spectrophotometer(c,
    { x: b.x, y: b.y + b.h * 0.24, w: b.w, h: b.h * 0.72 },
    { wavelength: 480, reading: '0.430', cell: [214, 78, 92, 0.7] })],
  ['比色皿 ×4（配对）', (c, b) => {
    const y0 = b.y + b.h * 0.42;
    for (let i = 0; i < 4; i++) {
      G.cuvette(c, { x: b.x + 8 + i * 28, y: y0, w: 18, h: 62 },
        { liquid: i === 0 ? [225, 232, 238, 0.2] : [214, 78, 92, 0.55] });
    }
  }],
  ['蓝晒印相卡 成品', (c, b) => G.cyanotypePrint(c,
    { x: b.x + 18, y: b.y + b.h * 0.34, w: b.w - 36, h: (b.w - 36) * 0.72 },
    { state: 'washed', density: 0.96, oxidized: 1 })],
  ['紫外曝光箱', (c, b) => G.uvExposureBox(c, { x: b.x, y: b.y + 12, w: b.w, h: b.h - 24 },
    { on: true, seconds: 40 })],
  ['显影盘（显影中）', (c, b) => G.developTray(c,
    { x: b.x, y: b.y + b.h * 0.26, w: b.w, h: b.h * 0.52 },
    { density: 0.9, oxidized: 0.4, t: 1.2 })],
  ['离心机（开盖）', (c, b) => G.centrifuge(c, { x: b.x, y: b.y + b.h * 0.30, w: b.w, h: b.h * 0.62 },
    { open: true, rpm: 3000, minutes: 5, spinning: true, t: 1.5 })],
  ['离心管 ×3', (c, b) => {
    for (let i = 0; i < 3; i++) {
      G.centrifugeTube(c, { x: b.x + 10 + i * 34, y: b.y + b.h * 0.34, w: 24, h: 100 },
        { liquid: [214, 226, 238, 0.3], level: 0.6, pellet: i === 1 ? 0.9 : 0, pelletColor: [236, 238, 240, 0.95] });
    }
  }],
  ['试管架 ×4', (c, b) => G.testTubeRack(c, { x: b.x + 4, y: b.y + b.h * 0.28, w: b.w - 8, h: b.h * 0.56 }, {
    tubes: [
      { liquid: [20, 60, 150, 0.65], level: 0.5, label: '深蓝' },
      { liquid: [235, 240, 244, 0.4], level: 0.5, solid: [240, 242, 244, 1], solidLevel: 0.8, label: 'AgCl' },
      { liquid: [216, 220, 140, 0.55], level: 0.5, solid: [222, 208, 90, 1], solidLevel: 0.8, label: 'AgI' },
      { dashed: true, label: '对照' },
    ],
  })],
];

const ROWS = Math.ceil(items.length / COLS);
cv.width = COLS * CELL_W * dpr;
cv.height = ROWS * CELL_H * dpr;
cv.style.width = (COLS * CELL_W) + 'px';
cv.style.height = (ROWS * CELL_H) + 'px';
const ctx = cv.getContext('2d');
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
ctx.fillStyle = '#0a0e12';
ctx.fillRect(0, 0, COLS * CELL_W, ROWS * CELL_H);
items.forEach(([name, fn], i) => {
  const col = i % COLS, row = (i / COLS) | 0;
  const ox = col * CELL_W, oy = row * CELL_H;
  ctx.save();
  ctx.translate(ox, oy);
  // 格子边框
  ctx.strokeStyle = 'rgba(160,180,196,0.12)';
  ctx.strokeRect(0.5, 0.5, CELL_W - 1, CELL_H - 1);
  ctx.font = '11px "PingFang SC", sans-serif';
  ctx.fillStyle = '#7b8c99';
  ctx.textAlign = 'left';
  ctx.fillText(name, 7, 15);
  // 器皿画在格子中下部
  fn(ctx, { x: 40, y: 34, w: CELL_W - 80, h: CELL_H - 74 });
  ctx.restore();
});
</script>
</body>
</html>
